<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="logoShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#logoGradient)" filter="url(#logoShadow)"/>
  
  <!-- Abstract balance/chart mark -->
  <g transform="translate(60, 60)">
    <!-- Left balance arm -->
    <path d="M -25 -10 L -15 -20 L -5 -10" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right balance arm (higher = growth) -->
    <path d="M 5 -20 L 15 -30 L 25 -20" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center pillar -->
    <line x1="0" y1="-15" x2="0" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Base -->
    <line x1="-15" y1="20" x2="15" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Growth indicator dots -->
    <circle cx="-15" cy="-20" r="3" fill="white" opacity="0.8"/>
    <circle cx="15" cy="-30" r="3" fill="white"/>
  </g>
  
  <!-- Persian letter ت (Taraz) integrated -->
  <g transform="translate(60, 85)" opacity="0.9">
    <path d="M -8 0 L 8 0 M 0 0 L 0 -8" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
