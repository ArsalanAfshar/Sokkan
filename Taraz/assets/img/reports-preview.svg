<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="rep-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pie1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pie2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Report Paper -->
  <rect x="30" y="10" width="540" height="380" rx="8" fill="#ffffff" stroke="#dde2ea" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="30" y="10" width="540" height="50" rx="8" fill="url(#rep-header)"/>
  <rect x="30" y="40" width="540" height="20" fill="url(#rep-header)"/>
  
  <text x="50" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">گزارش تحلیل مالی — شهریور ۱۴۰۴</text>
  
  <!-- Export Button -->
  <rect x="480" y="22" width="70" height="26" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="515" y="40" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">📥 خروجی PDF</text>
  
  <!-- KPI Cards Row -->
  <!-- Revenue -->
  <rect x="50" y="75" width="150" height="70" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="65" y="95" font-family="sans-serif" font-size="10" fill="#64748b">درآمد کل</text>
  <text x="65" y="120" font-family="sans-serif" font-size="18" font-weight="bold" fill="#059669">۴۵.۲M</text>
  <text x="65" y="135" font-family="sans-serif" font-size="9" fill="#10b981">↑ ۲۳٪ از ماه قبل</text>
  
  <!-- Expenses -->
  <rect x="215" y="75" width="150" height="70" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="230" y="95" font-family="sans-serif" font-size="10" fill="#64748b">هزینه‌ها</text>
  <text x="230" y="120" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ef4444">۱۸.۵M</text>
  <text x="230" y="135" font-family="sans-serif" font-size="9" fill="#f87171">↑ ۸٪ از ماه قبل</text>
  
  <!-- Profit -->
  <rect x="380" y="75" width="170" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="395" y="95" font-family="sans-serif" font-size="10" fill="#64748b">سود خالص</text>
  <text x="395" y="120" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2563eb">۲۶.۷M</text>
  <text x="395" y="135" font-family="sans-serif" font-size="9" fill="#60a5fa">حاشیه سود: ۵۹٪</text>
  
  <!-- Pie Chart Section -->
  <text x="50" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0c1b33">توزیع هزینه‌ها</text>
  
  <!-- Pie Chart -->
  <circle cx="120" cy="240" r="50" fill="url(#pie1)"/>
  <path d="M 120 240 L 120 190 A 50 50 0 0 1 165 215 Z" fill="url(#pie2)"/>
  <path d="M 120 240 L 165 215 A 50 50 0 0 1 155 275 Z" fill="#f59e0b"/>
  <path d="M 120 240 L 155 275 A 50 50 0 0 1 85 275 Z" fill="#8b5cf6"/>
  
  <!-- Legend -->
  <rect x="200" y="195" width="12" height="12" rx="2" fill="#059669"/>
  <text x="220" y="205" font-family="sans-serif" font-size="10" fill="#4a5568">حقوق و دستمزد (۴۵٪)</text>
  
  <rect x="200" y="215" width="12" height="12" rx="2" fill="#2563eb"/>
  <text x="220" y="225" font-family="sans-serif" font-size="10" fill="#4a5568">اجاره و خدمات (۲۵٪)</text>
  
  <rect x="200" y="235" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="220" y="245" font-family="sans-serif" font-size="10" fill="#4a5568">بازاریابی (۱۸٪)</text>
  
  <rect x="200" y="255" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="220" y="265" font-family="sans-serif" font-size="10" fill="#4a5568">سایر (۱۲٪)</text>
  
  <!-- Bar Chart Section -->
  <text x="340" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0c1b33">روند ۶ ماهه</text>
  
  <!-- Bars -->
  <rect x="350" y="250" width="20" height="40" rx="3" fill="#059669" opacity="0.6"/>
  <text x="360" y="300" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">فرو</text>
  
  <rect x="380" y="230" width="20" height="60" rx="3" fill="#059669" opacity="0.7"/>
  <text x="390" y="300" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">اردی</text>
  
  <rect x="410" y="220" width="20" height="70" rx="3" fill="#059669" opacity="0.8"/>
  <text x="420" y="300" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">خرداد</text>
  
  <rect x="440" y="200" width="20" height="90" rx="3" fill="#059669" opacity="0.9"/>
  <text x="450" y="300" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">تیر</text>
  
  <rect x="470" y="195" width="20" height="95" rx="3" fill="#059669" opacity="0.95"/>
  <text x="480" y="300" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">مرداد</text>
  
  <rect x="500" y="185" width="20" height="105" rx="3" fill="#059669"/>
  <text x="510" y="300" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">شهری</text>
  
  <!-- Trend Line -->
  <path d="M 360 245 L 390 225 L 420 215 L 450 195 L 480 190 L 510 180" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Summary Table -->
  <rect x="50" y="320" width="500" height="55" rx="6" fill="#f8f9fb" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="70" y="340" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4a5568">خلاصه عملکرد:</text>
  
  <text x="70" y="360" font-family="sans-serif" font-size="9" fill="#64748b">• میانگین درآمد ماهانه: ۳۸.۵ میلیون تومان</text>
  <text x="300" y="360" font-family="sans-serif" font-size="9" fill="#64748b">• نرخ رشد سالانه: ۴۵٪</text>
  <text x="480" y="360" font-family="sans-serif" font-size="9" fill="#64748b">• ROI: ۳.۲x</text>
</svg>